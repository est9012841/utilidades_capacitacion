[build-system]
requires = ['setuptools>=61.0','wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'utilidades_capacitacion'
version = '0.1.0'
description = 'Paquete local con funciones de calculo y validacion para capacitaciones'
readme = 'README.md'
requires-python = '>=3.8'
authors = [
    {name = 'Juan Carlos Moya Garcia', email = 'juancar.moygar@gmail.com'}
]
license = { text = 'MIT' }
keywords = ['funciones','validaciones']
classifiers = [
    'Programming Language :: Python :: 3',
    'License :: OSI Approved :: MIT License',
    'Operating System :: LMDE 7.0 Gigi'
]

dependencies = [
    'requests>=2.28',
    'numpy'
]

[project.optional-dependencies]
dev = [
    'pytest>=7.0',
    'black',
    'ruff'
]

[project.urls]
Homepage = 'https://github.com/est9012841/utilidades_capacitacion'
Repository = 'https://github.com/est9012841/utilidades_capacitacion'

[tool.setuptools.packages.find]
where = ['src']

